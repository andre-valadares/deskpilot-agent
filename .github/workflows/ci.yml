name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet (linux)
        run: go vet ./...

      - name: Vet (windows)
        run: GOOS=windows go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
